<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>E-House Manufacturing | CSI Engineering</title>
<meta name="description" content="From frame to field: see how a CSI e-house is built, tested and commissioned.">
<style>
:root{--cobalt:#284890;--navy:#173E6A;--sky:#5AA5D9;--ink:#0a1a30}
*{box-sizing:border-box}html{scroll-behavior:auto}
body{margin:0;background:var(--ink);color:#fff;font-family:Inter,system-ui,Segoe UI,Arial,sans-serif;-webkit-font-smoothing:antialiased}
#track{position:relative;height:1100vh}
#stage{position:sticky;top:0;height:100vh;width:100%;overflow:hidden;background:radial-gradient(120% 90% at 70% 30%,#1f4f86 0%,#12305a 45%,#0a1a30 100%)}
#stage::after{content:"";position:absolute;inset:0;z-index:3;pointer-events:none;background:linear-gradient(90deg,rgba(10,26,48,.82) 0%,rgba(10,26,48,.55) 32%,rgba(10,26,48,0) 60%),linear-gradient(0deg,rgba(10,26,48,.7) 0%,rgba(10,26,48,0) 28%)}
@media(max-width:700px){#stage::after{background:linear-gradient(0deg,rgba(10,26,48,.9) 0%,rgba(10,26,48,.6) 45%,rgba(10,26,48,0) 75%)}}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
header{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:22px clamp(20px,4vw,56px);z-index:5}
.brand{font-weight:800;letter-spacing:.14em;font-size:14px}.brand b{color:var(--sky)}
.cta{font-size:13px;font-weight:600;color:#fff;text-decoration:none;border:1px solid rgba(255,255,255,.4);padding:9px 16px;border-radius:999px}
.cta:hover{background:var(--sky);border-color:var(--sky);color:var(--ink)}
.panel{position:absolute;left:clamp(20px,4vw,56px);bottom:clamp(90px,14vh,150px);max-width:480px;z-index:4;opacity:0;transform:translateY(24px);transition:opacity .5s,transform .5s;pointer-events:none}
.panel.on{opacity:1;transform:none}
.eyebrow{font:500 12px ui-monospace,Consolas,monospace;letter-spacing:.2em;text-transform:uppercase;color:var(--sky)}
.panel h2{margin:12px 0 12px;font-size:clamp(28px,4.2vw,50px);line-height:1.05;font-weight:800;text-wrap:balance}
.panel p{margin:0;font-size:clamp(15px,1.4vw,18px);line-height:1.55;color:#cfdcec}
.panel ul{margin:14px 0 0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:8px}
.panel li{font-size:12px;padding:6px 11px;border:1px solid rgba(90,165,217,.5);border-radius:999px;color:#dcebf9;background:rgba(40,72,144,.35)}
#hud{position:absolute;left:clamp(20px,4vw,56px);right:clamp(20px,4vw,56px);bottom:28px;z-index:5;display:flex;align-items:center;gap:16px}
#bar{flex:1;height:3px;background:rgba(255,255,255,.18);border-radius:2px;position:relative}
#fill{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--sky);border-radius:2px}
#dots{position:absolute;inset:-5px 0;display:flex;justify-content:space-between}
#dots i{width:13px;height:13px;border-radius:50%;background:var(--ink);border:2px solid rgba(255,255,255,.35);cursor:pointer;transition:.3s}
#dots i.done{background:var(--sky);border-color:var(--sky)}
#count{font:500 12px ui-monospace,Consolas,monospace;letter-spacing:.14em;color:#9fb8d4;min-width:48px;text-align:right}
#hint{position:absolute;right:clamp(20px,4vw,56px);top:50%;font:500 11px ui-monospace,monospace;letter-spacing:.2em;text-transform:uppercase;color:#9fb8d4;writing-mode:vertical-rl;z-index:4;transition:opacity .4s}
#loading{position:absolute;inset:0;display:grid;place-items:center;z-index:9;background:var(--ink);font:500 12px ui-monospace,monospace;letter-spacing:.2em;color:#9fb8d4;transition:opacity .6s}
@media(max-width:700px){.panel{right:20px;bottom:100px}#hint{display:none}}
@media(prefers-reduced-motion:reduce){.panel{transition:none}}
</style>
</head>
<body>
<div id="track">
 <div id="stage">
  <div id="loading">LOADING E-HOUSE...</div>
  <canvas id="c"></canvas>
  <header><div class="brand">CSI <b>ENGINEERING</b></div><a class="cta" href="#contact">Talk to an engineer</a></header>
  <div id="panels"></div>
  <div id="hint">Scroll</div>
  <div id="hud"><div id="bar"><div id="fill"></div><div id="dots"></div></div><div id="count">01 / 08</div></div>
 </div>
</div>
<script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
<script type="module" src="./app.js"></script>
</body>
</html>
